<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="https://use.typekit.net/ygn5fve.css"></head><body><script>window.__CS_STATIC__={"products": {"p01": {"caption": {"en": "", "ko": ""}, "designers": [{"email": "", "ig": "j_oh_an", "label": "Designer", "name": {"en": "Johan Kim", "ko": "Johan Kim"}}], "exhibition": {"en": "Collective Seoul", "ko": "Collective Seoul"}, "freePos": null, "name": {"en": "Net Bench", "ko": "Net Bench"}, "order": 0, "photos": [], "thumb": null, "typology": {"en": "Bench", "ko": "Bench"}, "year": "2026"}, "p02": {"caption": {"en": "In a shared workspace, what kind of ‘focus’ do we achieve? \n\n‘Focus’ can encompass both intense concentration in one place while blocking out the surroundings, known as ‘closed focus,’ as well as immersing oneself in various spaces, engaging with diverse people, thoughts, and conversations, referred to as ‘open focus.’ Shared workspaces not only enable individual concentration but also provide a diverse and open environment to foster the synergy that arises from focusing on the surroundings.\n\nHowever, in today’s reality, people tend to immerse themselves in ‘closed focus’ to concentrate on their individual tasks. To address this aspect, Tower Plug, Array-Hurray! is introduced to naturally create ‘open focus’ in shared spaces. Designed in a tower format, it functions as a hub point to supply power from various locations, allowing for free immersion anytime, anywhere. Encircling the product encourages face-to-face experiences, promoting diverse communication.", "ko": "공유 업무 공간에서 우리는 어떤 ‘몰입’을 경험할까요?\n\n‘몰입’은 주변을 차단한 채 한곳에 깊이 집중하는 ‘닫힌 몰입’과, 다양한 공간에서 여러 사람과 생각, 대화를 접하며 빠져드는 ‘열린 몰입’을 모두 아우릅니다. 공유 업무 공간은 개인의 집중을 지원하는 동시에, 주변과의 교류 속에서 시너지가 생겨나는 다양하고 열린 환경을 제공합니다.\n\n하지만 실제로 우리는 각자의 업무에 집중하기 위해 ‘닫힌 몰입’에 머무르는 경우가 많습니다. 타워형 멀티탭 'Array-Hurray!'는 이러한 일상에 주목해, 공유 공간에서 자연스럽게 ‘열린 몰입’이 일어날 수 있도록 제안하는 제품입니다. 타워 형태로 설계되어 여러 방향에서 전원을 연결할 수 있는 거점이 되며, 언제 어디서든 자유롭게 몰입할 수 있도록 돕습니다. 또한 제품을 중심으로 사람들이 둘러앉아 서로 마주하는 경험을 유도하고, 다양한 대화와 교류가 이어질 수 있도록 합니다."}, "designers": [{"email": "", "ig": "jeykwack", "label": "Designer", "name": {"en": "Jey Kwack", "ko": "Jey Kwack"}}], "exhibition": "Zing!", "freePos": null, "name": {"en": "Array-Hurray!", "ko": "Array-Hurray!"}, "order": 1, "photos": ["90a03019806782c78bea1ae1fab30196", "555489041d65e2f820acbf6344833f32", "a1775a288b0b582a0bd3c5fa8e37b67b", "c6e24c84db863c12eb6eba604a3a1011"], "thumb": null, "typology": "Power Tower", "year": "2023"}, "p03": {"caption": {"en": "A knot holds, but never permanently. It ties in a second, and comes undone just as easily. In traditional Korean living spaces, things weren’t nailed to the wall. They were simply hung for a while, then taken down once they’d served their moment.\n\nA mirror lives the same way. We don’t dwell in front of it. we glance, we catch a moment, and we move on.\n\nHere is where the knot and the mirror meet. Both are made to serve the experience of a moment, not to last forever.\n\nSo Remain Mirror is not a mirror fixed to the wall, but an object that can be hung when needed and released again. Where the structure of tradition meets the time of an object, it proposes another way of occupying space. One founded not on fixing, but on staying.", "ko": "매듭이라는 가변적 고정 구조를 통해 ‘머묾’의 공간적 개념에서 시작한다.\n\n쉽게 묶이고 풀리는 매듭은 물건을 단단히 고정하기보다 잠시 걸어 두는 한국 전통 주거의 방식을 닮았으며, ‘잠시 건다’는 행위는 곧 찰나에 사용되는 거울의 성격과 자연스럽게 연결된다.\n\nRemain Mirror는 벽에 영구적으로 설치되는 거울이 아니라, 필요한 순간에 걸리고 다시 풀릴 수 있는 오브제이다.\n\n전통의 구조와 오브제의 시간이 만나는 지점에서, 고정이 아닌 머묾을 전제로 한 또 하나의 공간 방식을 제안한다."}, "designers": [{"email": "", "ig": "jeykwack", "label": "Designer", "name": {"en": "Jey Kwack", "ko": "Jey Kwack"}}], "exhibition": "Seoul Living Design Fair", "freePos": null, "name": {"en": "Remain", "ko": "Remain"}, "order": 2, "photos": ["cfa7bf0ff1ddcdab29a32f609b1e0ad4", "6f270efedfcc913fdebaa0949dcc12b5", "7a16970e31f6fa30b771ff208c62b12e"], "thumb": null, "typology": {"en": "Mirror", "ko": "Mirror"}, "year": "2026"}, "p04": {"caption": "Ragged Rug reinterprets traditional Tongyeong quilting(Nubi) by applying a distressing technique to layers of soft fabric stitched together for strength. Its dimensional surface, rich colors, and spontaneous textures reveal a new expression of this time-honored craft.\n\nInspired by the durable, layered quilting once used for the uniforms of naval forces during the Joseon Dynasty, Ragged Rug introduces distressing between the orderly lines of its quilted pattern. As the surface wears away, layers of fabric emerge and flow freely within the structured rhythm of the stitching, creating a richly tactile surface with shifting colors and depth.\n\nRagged Rug brings together the refined order of Tongyeong quilting(Nubi), preserved through generations, and the sensory freedom of its varied textures. Experience the distinctive beauty created by this contrast.\n\n부드러운 천을 여러 겹 포개 견고하게 누빈 통영 겹누비에 데미징 기법을 적용한 러그입니다. 입체적인 표면과 다채로운 색감, 자유로운 질감을 통해 전통적인 통영 누비의 새로운 매력을 보여줍니다.\n\nRagged Rug는 조선시대 수군의 의복에 사용되었던 견고한 통영 겹누비에서 영감을 받았습니다. 겹누비의 핵심인 규칙적인 누빔 패턴 사이에 데미징 기법을 더해 기존의 통영 누비와는 다른 모습을 구현했습니다. 마모를 통해 드러난 여러 겹의 원단은 누빔 패턴의 질서 안에서 자유롭게 유영하며, 입체적인 촉감과 풍부한 색채를 만들어냅니다.\n\n오랜 시간 견고하게 이어져 온 통영 겹누비의 정갈함과 다양한 감각을 자극하는 자유로운 질감이 공존하는 Ragged Rug에서 그 독특한 매력을 경험해 보세요.", "designers": [{"email": "", "ig": "jeykwack", "label": "Designer", "name": "Jey Kwack"}], "exhibition": "Tongyeong Creator Week", "freePos": null, "name": "Ragged Rug", "order": 3, "photos": [], "thumb": null, "typology": "Blanket", "year": "2024"}, "p05": {"caption": {"en": "Kite, a lighting piece, visualizes the tension and resistance acting on a kite as it rises with the wind, along with the momentary state of balance formed between these opposing forces.\n\nCurved surfaces created by joining sheets of hanji on both sides are used as a paper-engineered structure, forming a three-dimensional space in which light can reside.\nThrough folding, the light and delicate hanji forms its own volume, while the resulting curved surfaces reveal varying depths and contours depending on the viewing angle.", "ko": "바람을 타고 상승하는 연에 작용하는 긴장과 저항, 그리고 그 사이에서 형성되는 순간적인 균형 상태를 시각화한 조명 작업입니다.\n\n낱장의 한지를 양면으로 접합해 만들어지는 곡면을 지기 구조로 활용하여, 그 안에 빛이 머무르는 입체적 공간을 구성하였습니다.\n\n가볍고 얇은 종이가 접힘을 통해 스스로 부피를 형성하고, 그 과정에서 만들어진 곡면은 보는 각도에 따라 서로 다른 깊이와 윤곽을 드러냅니다."}, "designers": [{"email": "", "ig": "saemie.k", "label": "Designer", "name": {"en": "Saemie Kwon", "ko": "Saemie Kwon"}}], "exhibition": "Seoul Living Design Fair", "freePos": null, "name": {"en": "Kite", "ko": "Kite"}, "order": 4, "photos": [], "thumb": null, "typology": {"en": "", "ko": "Floor Lamp"}, "year": "2026"}, "p06": {"caption": {"en": "“Artificial, Can Be Real?”\n\nExtracted, Reconstructed, and Realized.\n[PROMPT EVIDENCE 01] is a physical evidence derived from a cognitive framework that distills Min Chang KIM’s design DNA using AI.\nFrom analyzing latent design genes to deconstructing structural parameters, this project represents a ”Phygital“ synthesis. A journey where a speculative prompt matures into a deterministic design syntax—captured in solid black hardwood and precision metal hardware.", "ko": "“Artificial, Can Be Real?”\n\nPROMPT EVIDENCE 01은 생성형 AI라는 가상의 잠재 공간에서 건져 올린 파편적 영감이 디자이너의 구조적 논리를 통해 물리적 실체로 안착한 첫 번째 ‘증거(Evidence)’입니다. 텍스트(Prompt)에서 사물(Object)로 이어지는 이 실험적 여정은 디지털 신호(Pixel)가 물리적 원자(Atom)로 치환되는 ‘피지털(Phygital)’ 프로세스를 대변합니다. 블랙 하드우드의 정갈한 실루엣과 정교하게 노출된 금속 결합부는 인간의 직관과 기계의 생성 논리가 중첩되어 만들어낸 새로운 설계 문법입니다. 단순한 가구를 넘어, 디자이너의 확장된 인지가 물리적 오브제로 수렴되는 과정 속에서 인공과 실재의 경계는 비로소 흐려집니다."}, "designers": [{"email": "", "ig": "min_chang1994", "label": "Designer", "name": {"en": "Minchang Kim", "ko": "Minchang Kim"}}], "exhibition": "Seoul Living Design Fair", "freePos": null, "name": "Prompt Evidence 01", "order": 5, "photos": ["e29cc9162fd33dd2fb1228dda2594c9c", "73e9842a3719bc09b9a81db68af18d13"], "thumb": null, "typology": {"en": "Chair", "ko": "Chair"}, "year": "2026"}, "p07": {"caption": "“The Column” is an Archifurniture project inspired by one of the architectural elements: the column.\n\nColumns perform the essential role of supporting the structure of buildings, and at times, they stand out due to various decorative elements. The “Column” project aims to reinterpret columns as furniture capable of storage, using them as a motif for reconfiguring space. By addressing the structural challenge of immovable columns, it proposes a new type of furniture with the paradoxical and intriguing concept of “space within a column.”\n\n‘The Column’은 건축의 요소 중 하나인 기둥에서 영감받아 시작한 Archifurniture 프로젝트입니다.\n\n기둥은 건물 구조를 지탱하는 필수적인 역할을 수행하며 때론 다양한 장식적 요소에 의해 그 존재감을 드러냅니다. 프로젝트 ‘Column’은 공간을 재구성할 때 구조적 문제로 건드릴 수 없는 기둥을 모티브로 하여 그 안에 수납이 가능한 가구로 재해석함으로써 ‘기둥 안의 공간’이라는 역설적이면서도 흥미로운 접근으로 새로운 형태의 가구를 제안합니다.", "designers": [{"email": "", "ig": "min_chang1994", "label": "Designer", "name": "Minchang Kim"}], "exhibition": "Little New Typology", "freePos": null, "name": "The Column", "order": 6, "photos": ["c27335fe41f3859dc3ed3725ba7cff73", "dd69a01e06a3bfc767f33fb6e7d1fd2b", "4e0ae1301e81133e0d70f9d0dfe6730a", "6b0173e4cfd1239a10198d109c9914b8", "f1fedcfa7bde98006f6266cd62610e81"], "thumb": null, "typology": "Shelf", "year": "2024"}, "p08": {"caption": {"en": "Form in transition, context in flux.\nInspired by the graphics and interactions of board games, the table unfolds like a gesture of play, expanding the surface before quietly returning to the rhythm and density of everyday life. The wood’s inherent character creates subtle geometric patterns through the structure itself, while the soft fabric surface within shifts the mood of the space and invites people to gather around it. The table becomes a structure that invites different scenes and modes of use.", "ko": "구조를 매개로 새로운 맥락을 제시한다. 보드게임의 그래픽과 물리적 상호작용을 가구의 형식으로 재구성했다. 보드나 패를 펼치는 행위처럼 상판이 펼쳐질 때 공간의 맥락이 확장되고, 접히는 순간 다시 일상의 밀도로 수렴된다. 테이블은 고정된 형태가 아니라, 공간 안에서 다양한 의미를 생성하는 구조로 작동한다."}, "designers": [{"email": "", "ig": "soomin.kim__", "label": "Designer", "name": {"en": "Soomin Kim", "ko": "Soomin Kim"}}], "exhibition": "Seoul Living Design Fair", "freePos": null, "name": {"en": "Tableau", "ko": "Tableau"}, "order": 7, "photos": ["879ce48024e3d5a079397f16a75a31b4", "6822aeb79836fb047fa85a0b6b5284b5", "1d8c9814386d2ce49aa706eefb82ac91", "20f0c8f9b7137d83a3c7965efad4d4d5", "8297f89b8c0f1b008230f008b093510c"], "thumb": null, "typology": "Side Table", "year": "2026"}, "p09": {"caption": {"en": "A bed set design for pet guest staying at Hoji. The repetitive volume of its thick cushions recalls the bedding brought out for a long-awaited guest at a grandmother’s house—slightly old-fashioned, yet warm and familiar.", "ko": "스테이 호지(Hoji)에 머무는 반려동물을 위한 펫 베드. 두툼한 방석의 반복이 만드는 볼륨감은 오래만의 귀한 손님에게 내어주는 할머니 댁 이불처럼, 어딘가 촌스럽지만 정감 가는 인상을 전합니다. 고정된 하나의 형태를 규정하지 않는 사물로서 호지가 오랜 시간 그려온 시골스러운 풍경의 일부가 됩니다."}, "designers": [{"email": "", "ig": "hnkinn", "label": "Designer", "name": {"en": "Haeun Kim", "ko": "Haeun Kim"}}], "exhibition": "Hoji × Toyo Gagu Club", "freePos": null, "name": {"en": "Yo Pet Bed", "ko": "Yo Pet Bed"}, "order": 8, "photos": [], "thumb": null, "typology": {"en": "", "ko": "Pet Bed"}, "year": "2026"}, "p10": {"caption": {"en": "Small furniture inspired by a window. Its flat triangular side can be placed against a wall, or it can be moved wherever needed using wheels. Each piece can be used individually or combined with other pieces. Arranged side by side, the small windows expand into one larger window, while two pieces can also be placed together to form an A-shape.", "ko": "창문을 닮은 작은 가구입니다. 직각삼각형의 반듯한 면은 벽에 붙여 두거나, 바퀴를 이용해 필요한 곳으로 옮길 수 있습니다. 하나씩 따로 또는 여러개를 이어서 사용할 수 있습니다. 나란히 놓으면 작은 창들이 하나의 큰 창처럼 확장되고, 두 개를 맞대어 놓으면 A자 형태로도 사용할 수 있습니다."}, "designers": [{"email": "", "ig": "_rayeonsu", "label": "Designer", "name": {"en": "Yeonsu Ra", "ko": "Yeonsu Ra"}}], "exhibition": {"en": "Collective Seoul", "ko": "Collective Seoul"}, "freePos": null, "name": {"en": "Window", "ko": "Window"}, "order": 9, "photos": [], "thumb": null, "typology": {"en": "", "ko": "Trolley"}, "year": "2026"}, "p11": {"caption": {"en": "“Focal Point” typically refers to the point where an image forms in optics, but in visual merchandising, it denotes the spot where the most special products are displayed in a store. People with unique tastes also have objects and products they want to highlight, but finding such a place in the home can be challenging.\n\nFocal Point incorporates the idea of ‘new typology’ in tray and lighting, bringing the exhibition experience of extraordinary spaces into the everyday home. Inspired by how products are enhanced with indirect or surface lighting in showrooms and exhibition spaces, this product is available in Wall and Table versions. It allows you to showcase your favorite items with a soft, ambient light, making them stand out in a special way.", "ko": "‘Focal Point’는 광학에서 초점, 즉 상이 맺히는 곳을 의미하고, VMD에서는 매장 내 가장 눈에 띄는 특별한 상품을 진열하는 장소를 뜻합니다. 자신만의 취향을 가진 사람들에게도 이렇게 초점을 맞춰 눈에 띄게 드러내고 싶은 오브제와 제품들이 있겠지만, 집에서 그러한 장소를 찾기는 조금 어려운 것 같습니다.\n\nFocal Point는 비일상적 공간의 전시 경험을 일상적 장소인 집에 가져오는 New Typology 트레이입니다. 쇼룸이나 전시장 같은 공간에서 간접광이나 면조명으로 제품을 더욱 돋보이게 만드는 모습에서 영감을 받은 이 제품은, Wall 및 Table 두 가지 버전으로 제공되어 내가 가장 아끼는 물건들을 은은한 불빛으로 특별하게 주목받을 수 있도록 연출해줍니다."}, "designers": [{"email": "", "ig": "@m1n9wan", "label": "Designer", "name": {"en": "Mingwan Bae", "ko": "배민관"}}, {"email": "", "ig": "so.wise", "label": "Designer", "name": {"en": "Sohyeon Ahn", "ko": "안소현"}}], "exhibition": {"en": "", "ko": "Little New Typology"}, "freePos": null, "name": {"en": "Focal Point", "ko": "Focal Point"}, "order": 10, "photos": ["2d63cc3acee3f29b5d3964fb387a34a1", "33fe564693fca3268fcd90b3c51597f5"], "thumb": null, "typology": "Shelf Light", "year": "2024"}, "p12": {"caption": {"en": "Arc Way is a modular bench designed to encourage interaction and engagement in public spaces. It features a movable seat around a C-shaped rail, allowing users to naturally influence each other’s actions as they move within and around the bench. By adjusting the position of the easily movable seat, users can create various scenarios, from face-to-face interactions without boundaries to personalized interactions based on the changing gaze, all within the same space.\n\nThe ‘inner’ space of the bench created by the C-shaped rail forms an enclosed circular area, providing an intimate and private environment separated from the outside surroundings. Users facing inwards are immersed in the interactions they create with one another within this space. On the other hand, users facing outward have the flexibility to relax independently or ventilate their surroundings in separate, individual spaces, taking advantage of the expansive nature of the external bench.\n\nIn this way, Arc Way is a modular bench that facilitates dynaamong users within a single space, depending on the free movement of the seat and the direction of user actions.", "ko": "Arc Way는 공공장소에서 사람들 사이의 교류와 참여를 유도하는 모듈형 벤치입니다. C자형 레일을 따라 움직이는 좌석을 통해, 사용자는 벤치 안팎에서 이동하며 자연스럽게 서로의 행동에 영향을 주고받습니다. 좌석의 위치를 손쉽게 조정할 수 있어, 경계 없이 서로 마주하는 만남부터 시선의 변화에 따른 개별적인 교류까지 하나의 공간 안에서 다양한 상황을 만들어냅니다.\n\nC자형 레일로 둘러싸인 벤치의 안쪽은 외부와 구분되는 원형 공간을 이루며, 친밀하고 사적인 분위기를 제공합니다. 안쪽을 향해 앉은 사용자들은 이 공간에서 서로 만들어가는 관계와 대화에 몰입하게 됩니다. 반면 바깥쪽을 향해 앉으면 외부로 열린 공간의 개방감을 누리며, 각자의 영역에서 독립적으로 휴식을 취하거나 주변으로 시선을 돌려 기분을 환기할 수 있습니다.\n\n이처럼 Arc Way는 좌석의 자유로운 이동과 사용자가 향하는 방향에 따라, 하나의 공간 안에서 다채로운 교류와 관계가 형성되도록 돕는 모듈형 벤치입니다."}, "designers": [{"email": "", "ig": "@songdong_archive", "label": "Designer", "name": {"en": "Donghwan Song", "ko": "Donghwan Song"}}, {"email": "", "ig": "yoo.seunghyeon", "label": "Designer", "name": {"en": "Seunghyeon Yoo", "ko": "유승현"}}], "exhibition": "Zing!", "freePos": null, "name": "Arc Way", "order": 11, "photos": ["788dab12ae4d593378a6286fcf670697", "b28a3655e4e68a0b9bd685b9cadacb0d", "27bbf09d8475d5b468bcdf0ea3e9dd90"], "thumb": null, "typology": {"en": "Bench", "ko": "Bench"}, "year": "2023"}, "p13": {"caption": {"en": "A modular work table made by layering off-the-shelf perforated metal panels radially and finishing them with fabric. The architectural volume and permeability of the panels overlap with the boundaries defined by the fabric, creating a light visual layering. By utilizing the compressibility of the fabric and the restoring force of metal sheets bent beyond 90 degrees, the structure maintains a secure, continuous connection using only top and bottom clips, without screws.", "ko": "기성 타공판을 방사형으로 겹쳐 패브릭으로 마감한 조립식 워크 테이블이다. 타공판의 건축적 볼륨과 투과성, 패브릭이 강조하는 경계가 중첩되어 가벼운 시각적 레이어를 형성한다. 패브릭의 압축성과 2도 과절곡된 금속판의 복원력을 이용해, 피스 없이 상하단의 클립만으로 지속적인 결합력을 유지한다."}, "designers": [{"email": "", "ig": "ahnseoho", "label": "Designer", "name": {"en": "Seoho Ahn", "ko": "Seoho Ahn"}}], "exhibition": {"en": "", "ko": "Collective Seoul"}, "freePos": null, "name": {"en": "", "ko": "Tri Radial Table"}, "order": 12, "photos": [], "thumb": null, "typology": {"en": "", "ko": "Table"}, "year": "2026"}, "p14": {"caption": {"en": "TL-1 began as an exploration of interpreting an object through the simplest formal language of planes and lines.\n\nThe lamp head is composed of two circular stainless steel plates, each laser-cut from 3 mm stainless steel. Positioned parallel to one another with a narrow gap in between, the two planes form the lamp head while housing only the essential components required to produce light, including a lithium-polymer battery, a USB Type-C charging module, and a single-LED module.\n\nTo preserve the purity of its form, TL-1 operates independently without any exposed wires or power adapter connected to an electrical outlet. Instead of using a clamp or additional fastening mechanism, it employs the tension of a solid stainless steel rod to achieve an intuitive method of fixation.", "ko": "입체를 면과 선으로 환원한 간결한 조형 언어.\n별도의 장치 없이 환봉의 텐션을 이용한 직관적인 고정 방식. 최소한의 요소로 완성한 절제된 실루엣의 테이블 램프."}, "designers": [{"email": "", "ig": "822_03_991", "label": "Designer", "name": {"en": "Dajeong Oh", "ko": "Dajeong Oh"}}], "exhibition": {"en": "", "ko": "Seoul Living Design Fair"}, "freePos": null, "name": {"en": "TL-1", "ko": "TL-1"}, "order": 13, "photos": ["7c8f3c1a4e61efb64614e92002747f75", "4617ef3fb3ccd066870771c9c2ca0bcb"], "thumb": null, "typology": "Table Light", "year": "2026"}, "p15": {"caption": {"en": "Yield is built on a study of ’yield strength‘ the point at which a material begins to deform permanently. By gradually applying force and observing where the material reaches its limit, the most natural form just before deformation was captured and held as the object’s shape. The form emerges at the threshold of force the material naturally accepts, so its curves are not drawn by design but shaped by the material itself.\n\nThe bend revealed here owes nothing to artificial processing. It is the material‘s own response to force. These natural curves flow into one another to form the silhouette of the piece.", "ko": "재료가 자연스럽게 받아들이는 힘의 한계점에서 형상이 만들어진다. 인위적인 가공 없이 드러난 휘어짐은, 자연스러운 곡선을 통해 가구의 실루엣을 이룬다."}, "designers": [{"email": "", "ig": "doheon.yu", "label": "Designer", "name": {"en": "Doheon Yu", "ko": "Doheon Yu"}}], "exhibition": {"en": "", "ko": "Seoul Living Design Fair"}, "freePos": null, "name": {"en": "Yield", "ko": "Yield"}, "order": 14, "photos": ["279e0201a74130ef21758ab00d52e928", "f6f459c062870d2a222818b4fe527f1a", "f80e0133d6059fcf1f89a21d7ae14d59"], "thumb": null, "typology": "Side Table", "year": "2026"}, "p16": {"caption": {"en": "‘Even spaces have an expiration date.’\nUnlike selective workspaces like cafes, co-working spaces have ‘fixed’ users. These fixed users typically continue to use the space within their living area, which can lead to a sense of familiarity and monotony over time. This repetitive experience with the space can make users of shared spaces feel the ‘expiration date’ of the space, ultimately resulting in an unsatisfactory experience.\n\n‘Shared space transformation by users’\nPartition party is a product that focuses on the natural transformation of space that occurs as various types of users utilize it. The partitions, which can be attached and detached as the backrest of a stool, enable users to move between concentration and interaction. Moreover, these mobile partitions, acting as stools, can be freely moved by users, allowing for continuous freshness by creating different separations and combinations of space. Someone might place a partition behind them in a secluded spot and focus on their work, while a group may use the partitions to create independent spaces for concentrating on their projects. Additionally, some people might choose open stools without partitions to interact with various individuals. Rather than strong, administrator-driven changes, these subtle and natural transformations through diverse ways of using the space will extend the space’s expiration date and infuse it with freshness.", "ko": "‘공간에도 유통기한이 있다.’\n그때그때 선택해 방문하는 카페와 달리, 코워킹 스페이스는 비교적 고정된 이용자를 갖습니다. 이용자들은 대개 자신의 생활권 안에서 같은 공간을 지속적으로 사용하며, 시간이 지날수록 익숙함과 단조로움을 느끼게 됩니다. 이러한 반복적인 경험은 공유 공간의 ‘유통기한’을 체감하게 하고, 결국 공간에 대한 만족도를 떨어뜨릴 수 있습니다.\n\n‘사용자가 만들어가는 공유 공간의 변화’\nPartition Party는 다양한 이용자가 공간을 사용하는 과정에서 자연스럽게 일어나는 변화에 주목한 제품입니다. 스툴의 등받이로 탈부착할 수 있는 파티션은 사용자가 집중과 교류 사이를 자유롭게 오갈 수 있도록 돕습니다. 또한 스툴의 역할을 겸하는 이동식 파티션을 원하는 곳으로 옮겨 공간을 나누거나 연결하면서, 익숙한 공간에 새로운 장면을 만들어냅니다.\n누군가는 한적한 곳에서 파티션을 등지고 자신의 작업에 몰입하고, 여럿이 모인 그룹은 파티션으로 독립적인 영역을 만들어 공동의 프로젝트에 집중할 수 있습니다. 반대로 파티션이 없는 개방된 스툴을 선택해 다양한 사람들과 교류할 수도 있습니다. 관리자가 주도하는 큰 변화보다, 각자의 사용 방식에서 비롯되는 작고 자연스러운 변화가 공간의 유통기한을 늘리고 지속적인 새로움을 더합니다."}, "designers": [{"email": "", "ig": "doheon.yu", "label": "Designer", "name": {"en": "Doheon Yu", "ko": "Doheon Yu"}}], "exhibition": "Zing!", "freePos": null, "name": "Partition Party", "order": 15, "photos": ["23c4cefaa0816adf753e2db179740d08", "841b135387113443d4f7b04083006ee1", "3ad47a61f7f4e627647d930756a5891b", "ee1be932c9fadb0b76414415a88f3145", "4f947f7d711162c63df10754e611e42c"], "thumb": null, "typology": {"en": "Chair", "ko": "Chair"}, "year": "2023"}, "p17": {"caption": {"en": "The TOT Modular Shelf can be freely expanded and reconfigured as needed, making it adaptable to various spaces and items. Thanks to its unique assembly structure and profile system, the shelf offers infinite expandability and variability. The profile acts as an “Anchor Point,” with bridges and covers surrounding the profile, ensuring a stable yet flexible structure by securely connecting with the panels. A basic module consists of two pipes and one top panel, and depending on the direction of expansion, it can create countless layouts.\n\nThe refined assembly method based on the profile ensures that the combination and assembly of modules result in a clean finish. This finish highlights the aesthetic appeal of the aluminum material, creating a “seamless” modular shelf.", "ko": "TOT Moduler Shelf는 필요에 따라 자유롭게 확장되고 재구성될 수 있는 선반으로, 독창적인 조립 구조와 프로파일 시스템 덕분에 다양한 공간과 사물에 맞춰 활용할 수 있습니다. 프로파일은 ‘Anchor Point’의 역할을 하며, 여기에 브릿지와 커버가 결합되어 안정적이면서도 유연한 구조를 만들어냅니다. 최소 단위의 모듈은 파이프 2개와 상판 1개로 구성되며, 확장 방향에 따라 다양한 레이아웃을 형성할 수 있습니다.\n\n알루미늄 재질의 미감을 살린 정제된 조립 방식은 모듈 간의 결합과 조립을 깔끔하게 하여 ‘Seamless’한 모듈형 선반을 제공합니다."}, "designers": [{"email": "", "ig": "doheon.yu", "label": "Designer", "name": {"en": "Doheon Yu", "ko": "Doheon Yu"}}], "exhibition": {"en": "", "ko": "Little New Typology"}, "freePos": null, "name": {"en": "TOT", "ko": "TOT"}, "order": 16, "photos": ["25d8f3f9a6df0074b8ba7128136947fa", "c213b0e9fa29da0f49edb5b3b1a383ce", "410447283643e132a0c7b8d33d17703c", "e7e1a09e0eae25ee93e37c2b55370960", "499a3271ff9803d5b8bc3193f4f0813f"], "thumb": null, "typology": {"en": "", "ko": "Module Shelf"}, "year": "2024"}, "p18": {"caption": "Inter-val is a partition that reinterprets elements of Tongyeong’s traditional Daebal bamboo blinds for contemporary lifestyles. Inspired by the process of crafting bamboo strips, the bold wooden sticks provide structural stability when arranged vertically as a partition. Thick ropes connect the sticks, with knotted joints functioning as hinges that allow the partition to form natural curves while creating a gradual visual rhythm through their evenly spaced intervals.\nBy transforming the flat, semi-transparent quality of traditional Daebal into a vertical three-dimensional structure, Inter-val creates layered visual effects that add depth and richness to the surrounding space.\n\nInter-val은 통영 전통 대발의 요소들을 오늘날의 라이프스타일에 담길 수 있도록 한 파티션\n입니다. 대발의 주재료인 대오리의 제작 과정에서 영감을 받은 우드스틱은 볼드한 형태로\n수직적인 파티션 구성에서도 안정적으로 지지할 수 있도록 도와줍니다. 우드스틱들을\n이어주는 두꺼운 로프의 매듭은 파티션의 힌지 역할을 하여 자연스러운 곡선을 형성하고\n우드스틱들의 동일한 간격 속에서 단계적 시각 흐름을 만들어냅니다. 비춰보이는 듯한\n대발의 평면적 특징이 수직으로 지면에 세워지면서 생기는 입체적인 시각 효과는 공간을\n보다 다채롭게 만들어줍니다.", "designers": [{"email": "", "ig": "doheon.yu", "label": "Designer", "name": "Doheon Yu"}], "exhibition": "Tongyeong Creator Week", "freePos": null, "name": "Inter-Val", "order": 17, "photos": [], "thumb": null, "typology": "Partition", "year": "2024"}, "p19": {"caption": {"en": "The Dusk Cabinet is designed around its fabric doors, using flexible materials within a rigid frame to enhance contrast. The woven fabric, with added shadow play, creates different impressions depending on the angle and intensity of light, allowing the cabinet to adapt to various atmospheres based on its placement and surroundings.\n\nThis design blurs the line between visible and hidden, sparking the imagination. Objects inside are visible only as silhouettes through the fabric, revealing their contours while concealing their full appearance. The sliding doors, utilizing the fabric’s flexibility, open and close smoothly, with the fabric flowing gracefully as the door opens. This movement evokes the feeling of drawing back a curtain to reveal what’s inside, offering the user a unique, emotionally engaging experience.", "ko": "Dusk cabinet은 패브릭 도어를 중심으로 디자인되었습니다. 딱딱한 프레임에 유연한 소재를 사용해 대비감을 극대화했으며, 직조감 있는 패브릭에 음영을 더해 빛의 각도와 강도에 따라 다른 인상을 줍니다. 이로 인해 공간에 놓이는 위치와 주변환경에 따라 다른 분위기로 연출이 가능합니다.\n\n보이는 것과 보이지 않는 것의 경계를 허물며, 상상력을 자극합니다. 캐비닛 내부의 오브제들은 패브릭을 통해 실루엣으로만 보이게 되어, 윤곽은 드러내면서도 전체적인 모습은 감춥니다. 패브릭의 유연성을 활용한 미닫이 문은 부드럽게 열리고 닫히며, 열림정도에 따라 패브릭이 유려하게 흐르며 이 행위는 마치 커텐을 열어 내부의 모습을 보는 듯한 느낌으로 사용자에게 특별한 감성적 터치를 전달합니다."}, "designers": [{"email": "", "ig": "eunbii.lee", "label": "Designer", "name": {"en": "Eunbi Lee", "ko": "이은비"}}], "exhibition": {"en": "", "ko": "Textile Parade"}, "freePos": null, "name": {"en": "Dusk Cabinet", "ko": "Dusk Cabinet"}, "order": 18, "photos": ["ded2eec4fb9bfacfa6fc3e0e2aaf5b9b", "ee2887a3ad745ef12b95d35fea383852"], "thumb": null, "typology": {"en": "Cabinet", "ko": "Cabinet"}, "year": "2024"}, "p20": {"caption": "", "designers": [{"email": "", "ig": "eunbii.lee", "label": "Designer", "name": "Eunbi Lee"}], "exhibition": "Tongyeong Creator Week", "freePos": null, "name": "Dawn Cabinet", "order": 19, "photos": [], "thumb": null, "typology": "Cabinet", "year": "2024"}, "p21": {"caption": {"en": "A Sort of Bag' is a lightweight bag designed to be easily dragged when carrying heavy loads. It is made from crinkly, thin nylon fabric and includes a minimal metal structure to prevent fabric damage.\n\nThe metal structure, consisting of pipes and thin metal plates to secure the wheels, is hidden beneath the fabric, maintaining the bag's simple and soft appearance. Additionally, the weight of the items inside the bag and the upward pull on the handle serve as a structural support, holding the fabric in place from both inside and outside.\n\nThe name \"A Sort of Bag\" reflects the ambiguity in defining its function as the bag’s structure is minimized.", "ko": "A Sort of Bag’은 무거운 짐을 들고 다닐 때 자연스럽게 끌고 다닐 수 있도록 설계된 얇은 짐가방입니다.\n바스락거리는 얇은 나일론 천과 원단의 손상을 방지하기 위한 최소한의 금속 구조로 제작되었습니다.\n\n금속 구조는 바퀴를 고정하기 위한 파이프와 얇은 금속 판으로 이루어져 있고, 해당 부분이 천으로 감춰져 있어 가방의 간결하고 부드러운 느낌을 유지합니다. 또한 가방 내부에 쌓인 물건과 손잡이를 위로 잡아당기는 힘은 가방 안팎에서 원단을 잡아주는 구조체의 역할을 대신합니다.\n\n'A Sort of Bag'이라는 이름은 가방을 이루는 구조가 축소되면서 그것의 역할을 정의하는 것이 모호함을 반영합니다."}, "designers": [{"email": "", "ig": "_bitspieces", "label": "Designer", "name": {"en": "Nara Jeong", "ko": "정나라"}}], "exhibition": {"en": "", "ko": "Textile Parade"}, "freePos": null, "name": {"en": "A Sort of Bag", "ko": "A Sort of Bag"}, "order": 20, "photos": ["ec727e69c306581496589c31e51f37bd"], "thumb": null, "typology": {"en": "Bag", "ko": "Bag"}, "year": "2024"}, "p22": {"caption": "Tangram is modular furniture designed with the idea of users reshaping and adapting their furniture to fit their environment — much like arranging the pieces of a tangram puzzle into ever-changing forms. Today‘s consumers have diverse tastes and personal styles, and they express these through the objects and furniture that define their spaces. Tangram proposes a modular furniture system that anyone can configure to suit their own needs.\n\n’Tangram’ 은 칠교놀이를 의미하는 단어입니다.\n조각을 여러 형태로 맞추는 퍼즐 놀이처럼 사용자가 가구를 환경에 맞도록 변형하며 사용하는 모습을 상상하고 기획 했습니다.\n최근 소비자들은 다양한 취향과 개성을 갖고 있고 이를 물건, 가구를 통해 공간에 드러냅니다.\n이러한 시대적 배경을 고려하여 소비자들이 본인의 필요에 맞게 구성 할 수 있는 모듈형 가구를 제안합니다.", "designers": [{"email": "", "ig": "hyuns.cho", "label": "Designer", "name": "Hyeonsu Cho"}], "exhibition": "Seoul Living Design Fair", "freePos": null, "name": "Tangram", "order": 21, "photos": ["098407398212219a2c9313a2bfdd5014", "876c9955b9861b68ef282dc84f16addb", "d6f85f0c82cf2ebe471a2b6f7e50028e", "3c3a077db6a5a87b76603f6bb2fb0730", "c3e0eb2d1ec84e25ad65115cda645ee1", "2c769f60acff3ed5d62d0d33997f642b", "81876acc952711ba649d24ee02e0bc85", "0cb8d003f274e6be4434db1745133fde"], "thumb": null, "typology": "Shelf, Trolley", "year": "2026"}, "p23": {"caption": {"en": "NAVI is a magazine rack inspired by the delicate motion of a butterfly's wings. Two layers of translucent wings are suspended on a sturdy stainless steel frame, while embroidered organza adds rhythm and direction to the light passing through. Books and magazines are stored in a way that gently reveals their presence, creating subtle silhouettes and a sense of visual lightness within the space.", "ko": "NAVI는 비상하는 나비에서 영감을 얻은 매거진 랙입니다.\n\n견고한 스테인리스 프레임의 위에 반투명한 두 겹의 날개가 겹쳐지고, 노방의 자수는 투과되는 빛에 리듬과 방향을 더합니다.\n\n책과 잡지는 ‘가볍게 드러내는’ 방식으로 수납되어 은은한 실루엣을 남기고, 공간 속에 유연하고 시각적인 여백을 만들어냅니다."}, "designers": [{"email": "", "ig": "toyogaguclub", "label": "Designer", "name": "Toyo Gagu Club"}], "exhibition": {"en": "", "ko": "Seoul Living Design Fair"}, "freePos": null, "name": "Navi", "order": 22, "photos": ["7577a54d969c036304c5811d1e586a4f", "d5d7b8919f95dc98cab5dfabc9865e5f", "df241dc90568bed125cfdc1091430655", "af01d6d9b3c285b15a5e0038eebf86a6", "d22ee640a662bd6bb838cc86f13a203f", "47462d8e7585cb6a26bece09c4a03dc0", "d8325047200dceebfc9459c19a1ac678"], "thumb": null, "typology": "Magazine Rack", "year": "2026"}, "p24": {"caption": {"en": "Unitools is a modular storage box that efficiently reinterprets the essence of storage.\nInspired by the functional simplicity of a toolbox, it uses a single handle to perform various storage functions. Unitools enables ‘putting,’ ‘stacking,’ and ‘holding’ with handles and different boards, offering easy assembly and modularity for versatile use in various spaces.", "ko": "Unitools는 ‘수납‘의 본질적 기능을 구조적으로 재해석하여 보다 효율적으로 설계된 모듈형 수납함입니다.\n\n툴박스의 명확한 기능적 목적에서 영감을 받아, 하나의 핸들로 다양한 수납 기능을 구현할 수 있도록 제작되었습니다. Unitools는 ‘담다(put)‘, ‘쌓아 올리다(stack)‘, ‘고정하다(hold)’ 라는 수납의 기본 기능을 핸들과 다양한 형태 및 크기의 판재로 구현하여, 간편한 조립과 모듈화를 통해 사용자 접근성을 높입니다. 이를 통해 다양한 공간과 용도에 맞추어 자유롭게 변형할 수 있습니다."}, "designers": [{"email": "", "ig": "@songdong_archive", "label": "Designer", "name": {"en": "Donghwan Song", "ko": "Donghwan Song"}}, {"email": "", "ig": "j_oh_an", "label": "Designer", "name": {"en": "Johan Kim", "ko": "Johan Kim"}}, {"email": "", "ig": "jeykwack", "label": "Designer", "name": {"en": "Jey Kwack", "ko": "Jey Kwack"}}], "exhibition": {"en": "Little New Typology", "ko": "Little New Typology"}, "freePos": null, "name": {"en": "Unitools", "ko": "Unitools"}, "order": 23, "photos": ["4eaadd40bc5b2733f6a7b0bbb5418d77", "533f993acb37dbdcf5f3cfcb5fb61474", "2aed4c70a3659af339f56b3fcfe1891f", "b8d93b8cc4139c1577c839516ceee907"], "thumb": null, "typology": "Tool Box", "year": "2024"}}, "archive": {"2ru7mb3a3f65uqihugas": {"order": 3, "photos": [], "title": "Tongyeong Creator Week", "year": "2024"}, "a1": {"order": 0, "photos": ["01efd33c6695abbf26cb0e5390f1756d", "03fe8a22e8bb0d94b9ca2b4fb99f0ec6"], "title": "Zing!", "year": "2023"}, "a2": {"order": 2, "photos": ["dc4e6b955351f5717349b7a0b570f1ff", "8ebf2dd185def53aceba1bbc18f93bd5"], "title": "Textile Parade", "year": "2024"}, "a3": {"order": 1, "photos": ["1fc092aa3d787690d7d0cd9a75866e4d", "fff5418b220f45f3ec1aced9c0ca47da", "c2c54af69da34a8de524438d351c40b8", "dfaba61db2046ab633f680ed2673637f"], "title": "Little New Typology", "year": "2024"}, "a4": {"order": 4, "photos": [], "title": "Seoul Living Design Fair", "year": "2026"}, "a5": {"order": 5, "photos": [], "title": "Collective Seoul", "year": "2026"}}, "config": {"brand": "Toyo Gagu Club", "brief": {"id": "9ad79f4a4ec1c524cab8830d3c072474", "label": "Community Brief", "name": "Toyo Gagu Club_Brief_2026.pdf", "url": ""}, "introL": "토요가구클럽은 ‘영감이 불어닥치는 곳’이라는 슬로건 아래, 디자이너들이 자발적으로 모여 각자의 디자인 과정과 사고를 나누는 비영리 라이프스타일 디자인 커뮤니티입니다. 서로의 작업을 살피고 크리틱과 토론을 이어가며, 새로운 인사이트를 발견하고 축적합니다. 우리가 주목하는 것은 완성된 결과물뿐 아니라 디자인이 형성되는 과정입니다. 서로 다른 관점이 교차하며 사고가 확장되고, 그 안에서 다음 단계의 가능성이 발견되는 순간을 중요하게 여깁니다. 참여자들은 자신의 작업을 공유하고 함께 검토하면서 개인의 영감을 공동의 언어로 정리하고, 이를 다음 탐구의 바탕으로 쌓아갑니다.\n\n이러한 탐구는 디자인을 바라보는 시각으로도 이어집니다. 디자인을 미학적 결과물이나 비즈니스 수단에 한정하지 않고, 사회와 환경을 구성하는 요소이자 도구로 이해합니다. 그 안에서 창작자의 태도와 관점, 자아가 어떻게 드러나고 작동하는지 살피며, 디자인이 개인의 성장을 넘어 동시대의 사회와 환경 속에서 어떤 역할을 할 수 있는지 질문합니다.\n\n이를 위해 다양한 의견과 해석이 오가고, 실험과 검토, 공유가 자연스럽게 이어지는 환경을 만들어갑니다. 개인의 서사와 타인의 관점이 만나 새로운 생각이 생겨나고, 그 생각을 함께 시험하고 구체화할 수 있는 장을 지향합니다.", "introR": "Toyo Gagu Club is a non-profit lifestyle design community where designers come together voluntarily to share their design processes and ways of thinking under the slogan 'Where inspiration strikes.' Through close engagement with one another’s work, critique, and discussion, we discover new insights and build on them over time. Our focus extends beyond finished outcomes to the process through which design takes shape. We value the moments when different perspectives meet, thinking expands, and possibilities for the next stage emerge. By sharing their work and reflecting on it together, participants translate individual inspiration into a shared language, building a foundation for further exploration.\n\nThis spirit of inquiry also informs how we understand design. We see it as more than an aesthetic outcome or a business tool: it is both a part of the social and physical world and a means of shaping it. We explore how creators’ attitudes, perspectives, and sense of self find expression and take effect through their practice, asking what role design can play in contemporary society and the environment, beyond individual growth.\n\nTo support this exploration, we cultivate an environment where diverse opinions and interpretations circulate freely, and experimentation, reflection, and exchange unfold naturally. We aspire to create a space where personal narratives meet the perspectives of others, giving rise to new ideas that can be tested and developed together.", "logo": null}, "files": {"90a03019806782c78bea1ae1fab30196": "img/90a03019806782c78bea1ae1fab30196.jpg", "555489041d65e2f820acbf6344833f32": "img/555489041d65e2f820acbf6344833f32.jpg", "a1775a288b0b582a0bd3c5fa8e37b67b": "img/a1775a288b0b582a0bd3c5fa8e37b67b.jpg", "c6e24c84db863c12eb6eba604a3a1011": "img/c6e24c84db863c12eb6eba604a3a1011.jpg", "cfa7bf0ff1ddcdab29a32f609b1e0ad4": "img/cfa7bf0ff1ddcdab29a32f609b1e0ad4.jpg", "6f270efedfcc913fdebaa0949dcc12b5": "img/6f270efedfcc913fdebaa0949dcc12b5.jpg", "7a16970e31f6fa30b771ff208c62b12e": "img/7a16970e31f6fa30b771ff208c62b12e.jpg", "e29cc9162fd33dd2fb1228dda2594c9c": "img/e29cc9162fd33dd2fb1228dda2594c9c.jpg", "73e9842a3719bc09b9a81db68af18d13": "img/73e9842a3719bc09b9a81db68af18d13.jpg", "c27335fe41f3859dc3ed3725ba7cff73": "img/c27335fe41f3859dc3ed3725ba7cff73 <title>Collective Seoul Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Latin text is Futura PT Medium (500) to match macOS's default Futura; Noto Sans KR ships only 400/700, so Hangul stays Regular. */
/* Layout: centered single column, wide margins, Futura-like wordmark at the top of every page; the only rule sits above the designer footer. Single light theme by design (white paper, black ink). */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --mute:#6b6b6b;
  --faint:#f2f2f2;
  --warn:#b00020;
  --line-soft:#c8c8c8;
  --flash:#DAFF35;
  --rule:1px solid var(--ink);
  --f-sans:"futura-pt","Futura","Futura PT","Jost","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"futura-pt","Futura","Futura PT","Jost",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;transition:none!important;animation:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;font-weight:500;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:960px;margin:0 auto;padding-inline:16px}
.wrap.narrow{max-width:720px}
.wrap.wide{max-width:1400px}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:13px}
.on{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.grow{flex:1}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:var(--rule);z-index:10}
.bar .wrap{display:flex;align-items:center;gap:12px;height:52px}
.back{font-size:20px;line-height:1;padding:8px 8px 8px 0}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:var(--mute);text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}

/* public pages: centered wordmark head, open white space, one rule above the designer footer */
.page{flex:1;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;padding-inline:max(16px,7vw);padding-block:0 40px}
@media (min-width:640px){.page{padding-inline:44px}}
.head{position:relative;text-align:center;padding-top:40px}
.head .brand{font-size:17px;letter-spacing:-.005em}
.head .brand img{display:block;height:18px;width:auto;max-width:60vw}
.head .ptitle{margin:44px 0 0;font-size:24px;font-weight:500;letter-spacing:-.005em;line-height:1.2}
.head.nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding-top:48px}
.head.nav .ptitle{margin:0}
.head .hback{justify-self:start;margin-left:-8px;padding:8px;color:var(--ink);-webkit-tap-highlight-color:transparent}
.head .hback svg{display:block;width:24px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter}
.inset{padding-inline:clamp(0px,6.5vw,32px)}
.lbl{font-size:9px;line-height:1.2;letter-spacing:.02em;margin-bottom:6px}
.val{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-size:15px;letter-spacing:.02em}
.th img,.th svg,.mini img,.mini svg,.tbox img,.tbox svg{display:block;width:100%;height:100%;object-fit:contain}
.th svg,.mini svg,.tbox svg{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}

/* intro */
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;text-align:center}
.wordmark{margin:0;font-size:clamp(38px,11.5vw,76px);font-weight:500;letter-spacing:-.01em;line-height:1}
.logo img{display:block;max-width:min(360px,86vw);max-height:160px}
.intro .langs{margin-top:64px}
.langs{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;letter-spacing:.01em}
.langs button{padding:3px 6px}
.langs.row{flex-direction:row;gap:10px;font-size:11px}
.hint{margin:22px 0 0;color:var(--mute);font-size:11px}

/* menu */
.menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,7vw,36px);padding:48px 0;text-align:center}
.menu .item{font-size:clamp(26px,11.8vw,52px);line-height:1.1;letter-spacing:-.005em}
.menu .item{-webkit-tap-highlight-color:transparent}
.menu .item.flash{color:var(--flash)}
.enter{margin-top:56px;padding:12px;color:var(--ink);-webkit-tap-highlight-color:transparent}
.enter svg{display:block;width:48px;height:24px;fill:none;stroke:currentColor;stroke-width:4.4;stroke-linecap:square;stroke-linejoin:miter}
.enter.flash{color:var(--flash)}
.cell,.fi{-webkit-tap-highlight-color:transparent}
.cell.flash,.fi.flash{color:var(--flash)}
.timg::after{content:"";position:absolute;inset:0;background:var(--flash);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;visibility:hidden}
.flash .timg img{visibility:hidden}
.flash .timg::after{visibility:visible}
.edit-link{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;font-size:11px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}

/* gallery */
.views{display:flex;justify-content:center;margin-top:18px}
.gal{margin-top:56px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.cell{position:relative;display:block;width:100%;aspect-ratio:1}
.cell .no,.fi .no{position:absolute;top:0;left:0;font-family:var(--f-mono);font-size:9px;letter-spacing:.04em}
.cell .th{position:absolute;inset:16% 10% 6%}
.free{position:relative;width:100%;aspect-ratio:5/8}
.fi{position:absolute;display:block;aspect-ratio:1;transform:translate(-50%,-50%)}
.fi .th{position:absolute;inset:12% 0 0}
.fi .no{top:-2px;left:-10%}
.free.edit{outline:1px dashed var(--mute)}
.free.edit .fi{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.free.edit .fi.sel{outline:1px solid var(--ink);z-index:2}

/* detail */
.det{flex:1;display:flex;flex-direction:column}
.dtop{margin-top:56px;text-align:center}
.dname{margin-top:6px;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.det .big{width:min(78%,340px);aspect-ratio:1;margin:40px auto 0}
.info{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) auto;gap:16px;margin-top:56px}
.capt+.capt{margin-top:44px}
.capt{margin:56px 0 0;font-size:13px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere;max-width:62ch}
.photos{display:grid;gap:12px;margin-top:48px}
.photos img{display:block;width:100%}
.ph{aspect-ratio:4/3;border:1px solid var(--line-soft);display:grid;place-items:center;color:var(--mute);font-size:11px;text-align:center;padding:16px}
.pager{display:flex;justify-content:space-between;margin-top:40px;font-family:var(--f-mono);font-size:11px}
.pager button:hover{text-decoration:underline;text-underline-offset:3px}

/* designer footer */
.foot{margin-top:auto;padding-top:72px}
.foot hr{margin:0;border:0;border-top:1px solid var(--ink)}
.foot .fin{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:40px}
.foot .fin+.fin{padding-top:28px}
.foot .fname{min-width:0}
.foot .fright{text-align:right;font-size:13px;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.foot a{color:inherit;text-decoration:none}
.foot a:hover{text-decoration:underline}
.bfoot{display:flex;justify-content:center;padding-bottom:24px}
.blink{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.blink span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.blink svg{display:block;width:11px;height:14px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:square;stroke-linejoin:miter}
.blink.flash{color:var(--flash)}

/* archive: two text columns, then exhibition list + photo stack */
.alist{margin-top:56px;display:grid;gap:72px}
.acols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,4vw,28px);align-items:start}
.acol{display:grid;gap:1.3em;font-size:clamp(9.5px,2.5vw,12.5px);line-height:1.55;overflow-wrap:anywhere}
.acol p{margin:0;white-space:pre-line}
.acol:lang(ko){word-break:keep-all}
.exh{display:grid;justify-items:center;text-align:center;margin-top:48px}
.exw{width:100%;display:grid;justify-items:center}
.exi{display:inline-block;position:relative;padding:clamp(2px,.8vw,5px) 0;-webkit-tap-highlight-color:transparent}
.exi .en{display:inline;font-size:clamp(22px,7vw,40px);line-height:1.1;letter-spacing:-.005em;overflow-wrap:anywhere}
.exi .ey{position:relative;top:-1.15em;margin-left:3px;font-family:var(--f-mono);font-size:9px;letter-spacing:.02em}
.exph{display:grid;gap:12px;width:100%;margin:10px 0 24px}
.exph img{display:block;width:100%;height:auto}
.stack{position:relative;width:100%;aspect-ratio:4/5;-webkit-tap-highlight-color:transparent}
.stack .card{position:absolute;left:50%;top:50%;max-width:84%;max-height:84%;width:auto;height:auto;display:block;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.22);user-select:none;-webkit-user-select:none}
.stack .card.blank{width:74%;height:76%;max-width:none;max-height:none;background:#ececec;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.stack .cnt{position:absolute;right:0;bottom:-18px;font-family:var(--f-mono);font-size:9px;color:var(--mute)}
.empty{color:var(--mute);font-size:13px;text-align:center}
.ahalf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.ahalf{grid-template-columns:1fr}}
.ahalf textarea{min-height:260px}

/* builder */
.btabs{display:flex;align-items:center;gap:20px;overflow-x:auto;padding-block:12px;border-bottom:var(--rule)}
.btabs>button{white-space:nowrap;padding:4px 0;font-weight:500}
.note{margin:16px 0 0;border:var(--rule);padding:10px 12px;font-size:13px}
.blay{display:grid;gap:20px;padding-block:20px 64px}
.plist{display:flex;overflow-x:auto;border:var(--rule)}
.pli{display:flex;align-items:center;flex:0 0 auto;border-right:var(--rule)}
.pli .pick{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 8px;min-width:0;width:150px}
.pli .nm{min-width:0;flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{flex:0 0 auto;width:32px;height:32px}
.pli .mv{display:flex;flex-direction:column;padding-right:4px}
.pli .mv button{font-size:11px;line-height:1;padding:3px 4px}
.pli.nophoto{background:var(--flash)}
.pli.cur{background:var(--ink);color:var(--paper)}
.pli.cur.nophoto{box-shadow:inset 6px 0 0 var(--flash)}
.pli.over{outline:2px solid var(--ink);outline-offset:-3px}
.prevcol{min-width:0}
.plabel{margin-bottom:6px}
.prev{border:var(--rule);padding-inline:16px;max-height:80vh;overflow:auto}
@media (min-width:760px){
  .blay{grid-template-columns:220px minmax(0,1fr)}
  .plist{flex-direction:column;overflow-x:visible;overflow-y:auto;max-height:80vh;position:sticky;top:64px;align-self:start}
  .pli{border-right:0;border-bottom:var(--rule)}
  .pli .pick{width:auto;flex:1}
  .prevcol{grid-column:1/-1}
}
@media (min-width:1180px){
  .blay{grid-template-columns:220px minmax(0,1fr) 380px}
  .prevcol{grid-column:auto;position:sticky;top:64px;align-self:start}
}
.bform,.bnarrow{display:grid;gap:18px;min-width:0;align-content:start}
.bnarrow{max-width:760px;padding-block:20px 64px}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fhead h2{margin:0;font-size:20px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.fld{display:grid;gap:6px;min-width:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.pair{grid-template-columns:1fr}}
input:not([type=range]):not([type=file]),textarea{width:100%;border:var(--rule);border-radius:0;padding:8px 10px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
input[type=range]{accent-color:var(--ink);flex:1;min-width:120px}
.btn{display:inline-flex;align-items:center;border:var(--rule);padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer;background:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.warn,.warn{border-color:var(--warn);color:var(--warn)}
.thumbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbox{width:88px;height:88px;border:var(--rule);padding:8px}
.phl{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.phi{border:var(--rule)}
.phi img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.phc{display:flex;justify-content:space-between;border-top:var(--rule)}
.phc button{padding:4px 8px;font-size:12px}
.ftools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:40px;padding-block:10px}
.ahead{display:flex;justify-content:space-between;align-items:center;border-bottom:var(--rule);padding-bottom:10px}
.acard{display:grid;gap:8px;padding-bottom:18px;border-bottom:var(--rule)}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arow input{max-width:140px}
.gate{flex:1;display:grid;place-items:center;padding:48px 16px;text-align:center}
</style>

<div id="app"></div>

<script>
(function(){
// the exported public site injects its data here (no db, no builder)
const STATIC = window.__CS_STATIC__ || null;
const N = 24;
const IDS = Array.from({length:N}, (_, i) => 'p' + String(i + 1).padStart(2, '0'));
const TX = {
  ko:{designer:'디자이너',typology:'유형',year:'연도',exhibition:'전시',caption:'설명',photo:'사진',photoTodo:'업로드 예정',archiveSub:'브랜드 히스토리',seoulSub:'24개의 제품',hint:'밑줄 친 언어를 한 번 더 누르면 입장합니다',prev:'이전',next:'다음',edit:'편집',empty:'아직 등록된 기록이 없습니다.',loading:'불러오는 중…',back:'뒤로',objects:'24 Objects'},
  en:{designer:'Designer',typology:'Typology',year:'Year',exhibition:'Exhibition',caption:'Caption',photo:'Photo',photoTodo:'to be added',archiveSub:'Brand history',seoulSub:'24 objects',hint:'Tap the underlined language again to enter',prev:'Prev',next:'Next',edit:'Edit',empty:'No entries yet.',loading:'Loading…',back:'Back',objects:'24 Objects'}
};
// Placeholder line drawings until the toon-render PNGs are uploaded.
const PH = [
  '<path d="M33 16v46M67 16v46M33 16h34M33 28h34M27 62h46v6H27zM31 68v22M69 68v22"/>',
  '<ellipse cx="50" cy="34" rx="24" ry="7"/><path d="M26 34v5c0 5 48 5 48 0v-5M33 43l-7 45M67 43l7 45M31 70h38"/>',
  '<path d="M34 18h32l10 26H24zM50 44v40M36 88h28"/>',
  '<path d="M12 42h76v6H12zM18 48v40M82 48v40"/>',
  '<path d="M42 14h16v9c0 4 14 10 14 31s-9 34-22 34-22-13-22-34 14-27 14-31z"/>',
  '<path d="M22 12v78M78 12v78M22 30h56M22 52h56M22 74h56"/>'
];

const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const S = {
  lang: 'en',
  view: ls.get('cs.view') === 'grid' ? 'grid' : 'free',
  products:{}, archive:{}, config:{}, gone:new Set(),
  db:null, assets:null, canEdit:false, ready:false, loaded:false,
  demo: !STATIC && !(window.claude && window.claude.use),
  sel:'p01', ex:null, exTop:0, btab:'products', freeSel:null, confirm:null, status:'', dragPid:null
};
let drag = null;

const tx = k => TX[S.lang][k];
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* one text per field; legacy {ko,en} values fold into one (long text keeps both, EN first) */
const txt = (x, long) => { if (x == null) return ''; if (typeof x !== 'object') return String(x); const e = String(x.en || '').trim(), k = String(x.ko || '').trim(); if (!e || !k || e === k) return e || k; return long ? e + '\n\n' + k : e; };
const loc = x => txt(x).trim();
const paras = x => txt(x, true).split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
const src = id => STATIC ? (STATIC.files[id] || '') : '/_blob/' + id;
const clone = o => JSON.parse(JSON.stringify(o));
function setPath(o, path, v){ const k = path.split('.'); let t = o; for (let i = 0; i < k.length - 1; i++) t = t[k[i]]; t[k[k.length - 1]] = v; }
function rnd(seed){ let a = seed * 2654435761 >>> 0; return () => { a = a + 0x6D2B79F5 >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- data: pending local edits win over snapshots until saved ---------- */
const pend = {}, timers = {}, queues = {};
let vc = 0;
function setStatus(m){ S.status = m; const el = document.getElementById('bstatus'); if (el) el.textContent = m; }
function apply(path, data){
  const [col, id] = path.split('/');
  if (col === 'products') S.products[id] = data;
  else if (col === 'archive') S.archive[id] = data;
  else S.config = data;
}
function edit(path, data, delay){
  const v = ++vc; pend[path] = {data, v};
  clearTimeout(timers[path]);
  setStatus('편집 중…');
  if (!delay) flush(path); else timers[path] = setTimeout(() => flush(path), delay);
}
function flush(path){
  clearTimeout(timers[path]);
  const p = pend[path]; if (!p) return;
  const {data, v} = p;
  queues[path] = (queues[path] || Promise.resolve())
    .then(() => S.db ? S.db.doc(path).set(data) : null)
    .then(() => {
      apply(path, data);
      if (pend[path] && pend[path].v === v) delete pend[path];
      setStatus(S.db ? '저장됨' : '반영됨 (미리보기 모드: 새로고침하면 사라짐)');
    }, e => setStatus('저장 실패 (' + ((e && e.code) || 'unknown') + '). 다시 수정하면 재시도합니다.'));
}
window.addEventListener('pagehide', () => Object.keys(pend).forEach(flush));

function normP(r, i, id){
  return {id, order: typeof r.order === 'number' ? r.order : i, thumb: r.thumb || null,
    designers: normDesigners(r), name:txt(r.name), typology:txt(r.typology), caption:txt(r.caption, true),
    year: r.year ?? '', exhibition:txt(r.exhibition),
    photos: Array.isArray(r.photos) ? r.photos.slice() : [],
    freePos: r.freePos ? {x:+r.freePos.x, y:+r.freePos.y, w:+r.freePos.w} : null};
}
function normDesigners(r){
  const list = Array.isArray(r.designers) ? r.designers : [{label:'Designer', name:r.designer, ig:r.designerIg, email:r.designerEmail}];
  const out = list.map(x => ({label: (x && x.label) || 'Designer', name: txt(x && x.name), ig: (x && x.ig) || '', email: (x && x.email) || ''}));
  return out.length ? out : [{label:'Designer', name:'', ig:'', email:''}];
}
function product(id){ const path = 'products/' + id; return normP((pend[path] && pend[path].data) || S.products[id] || {}, IDS.indexOf(id), id); }
function plist(){ return IDS.map(product).sort((a, b) => a.order - b.order || a.id.localeCompare(b.id)); }
function saveP(p, delay){ const {id, ...d} = p; edit('products/' + id, d, delay); refreshSide(); }

function aEntry(id){ const path = 'archive/' + id; const r = (pend[path] && pend[path].data) || S.archive[id] || {}; return {order: r.order ?? 0, year: r.year ?? '', title:txt(r.title), photos: Array.isArray(r.photos) ? r.photos.slice() : (r.image ? [r.image] : [])}; }
function alist(){
  const ids = new Set(Object.keys(S.archive));
  Object.keys(pend).forEach(k => { if (k.startsWith('archive/')) ids.add(k.slice(8)); });
  return [...ids].filter(id => !S.gone.has(id)).map(id => ({id, ...aEntry(id)})).sort((a, b) => a.order - b.order || a.id.localeCompare(b.id));
}
function conf(){ const r = (pend['site/config'] && pend['site/config'].data) || S.config || {}; return {logo: r.logo || null, brand: r.brand || '', introL: r.introL != null ? String(r.introL) : (r.archiveIntro && typeof r.archiveIntro === 'object' ? String(r.archiveIntro.ko || '') : txt(r.archiveIntro)), introR: r.introR != null ? String(r.introR) : (r.archiveIntro && typeof r.archiveIntro === 'object' ? String(r.archiveIntro.en || '') : ''), brief: {id: (r.brief && r.brief.id) || null, name: (r.brief && r.brief.name) || '', url: (r.brief && r.brief.url) || '', label: (r.brief && r.brief.label) || ''}}; }
function saveC(c, delay){ edit('site/config', c, delay); }

function fpos(p){
  if (p.freePos && isFinite(p.freePos.x)) return p.freePos;
  // default: 3 columns x 8 rows in display order, each nudged a little off the grid
  const i = Math.max(0, plist().findIndex(x => x.id === p.id)), r = rnd(IDS.indexOf(p.id) + 7);
  return {x: 18 + (i % 3) * 32 + (r() - .5) * 10, y: 5.5 + Math.floor(i / 3) * 12.4 + (r() - .5) * 3, w: 17 + r() * 4};
}

/* ---------- views ---------- */
function thumb(p){ return p.thumb ? `<img src="${src(p.thumb)}" alt="" loading="lazy" draggable="false">` : `<svg viewBox="0 0 100 100" aria-hidden="true">${PH[IDS.indexOf(p.id) % PH.length]}</svg>`; }
function bar(title, back, wide){ return `<header class="bar"><div class="wrap ${wide ? 'wide' : ''}"><button class="back" data-go="${back}" aria-label="${tx('back')}">←</button><div class="ttl mono">${esc(title)}</div></div></header>`; }
function head(title, back){
  if (back) return `<header class="head nav"><button class="hback" data-go="${back}" aria-label="${tx('back')}"><svg viewBox="0 0 24 16" aria-hidden="true"><path d="M23 8H2.5M9 1.5L2.5 8 9 14.5"/></svg></button>${title ? `<h1 class="ptitle">${esc(title)}</h1>` : '<span></span>'}<span></span></header>`;
  return `<header class="head">${back ? `<button class="hback" data-go="${back}" aria-label="${tx('back')}">←</button>` : ''}<button class="brand" data-go="intro" aria-label="${esc(brandName())} · 처음으로">${conf().logo ? `<img src="${src(conf().logo)}" alt="${esc(brandName())}">` : esc(brandName())}</button>${title ? `<h1 class="ptitle">${esc(title)}</h1>` : ''}</header>`;
}
function brandName(){ return conf().brand || 'Toyo Gagu Club'; }
function igHandle(v){ return String(v || '').trim().replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/\/.*$/, ''); }
function briefFoot(b){
  const label = esc(b.label || 'Community Brief');
  const url = /^https?:\/\//i.test(b.url || '') ? b.url : '';
  if (!b.id && !url) return '';
  const down = '<svg viewBox="0 0 16 20" aria-hidden="true"><path d="M8 1.5v15M2.5 11 8 16.5 13.5 11"/></svg>';
  const out = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5 13 3M5 2.5h8.5V11"/></svg>';
  const link = b.id ? `<button class="blink" data-brief>${down}<span>${label}</span></button>` : `<a class="blink" href="${esc(url)}" target="_blank" rel="noopener">${out}<span>${label}</span></a>`;
  return `<footer class="foot bfoot">${link}</footer>`;
}
function foot(people){
  const rows = people.map(x => ({...x, h: igHandle(x.ig)})).filter(x => x.name || x.h || x.email);
  if (!rows.length) return '';
  return `<footer class="foot"><hr>${rows.map(x => `<div class="fin inset"><div class="fname"><div class="lbl">${esc(x.label || 'Designer')}</div><div class="val">${esc(x.name || '—')}</div></div>
  <div class="fright">${x.h ? `<div><a href="https://www.instagram.com/${encodeURIComponent(x.h)}/" target="_blank" rel="noopener">@${esc(x.h)}</a></div>` : ''}${x.email ? `<div>${esc(x.email)}</div>` : ''}</div></div>`).join('')}</footer>`;
}

function vIntro(){
  const c = conf();
  return `<main class="intro">${c.logo ? `<div class="logo"><img src="${src(c.logo)}" alt="${esc(brandName())}"></div>` : `<h1 class="wordmark">${esc(brandName())}</h1>`}
  <button class="enter" data-go="menu" data-flash aria-label="Enter"><svg viewBox="0 0 48 24" aria-hidden="true"><path d="M2 12h40M31 3l11 9-11 9"/></svg></button></main>`;
}
function vMenu(){
  return `<div class="page">${head('', '')}<main class="menu"><button class="item" data-go="archive" data-flash>Archive</button><button class="item" data-go="seoul" data-flash>Collective Seoul</button></main></div>
  ${(S.canEdit || S.demo) ? `<button class="edit-link" data-go="builder">Builder · ${tx('edit')}</button>` : ''}`;
}
// thumbnail wrapper; an uploaded PNG also carries itself as a mask so the tap flash can recolor the line art
function thSpan(p){ return p.thumb ? `<span class="th timg" style="--m:url('${src(p.thumb)}')">${thumb(p)}</span>` : `<span class="th">${thumb(p)}</span>`; }
function vGrid(ps){
  return `<div class="grid">${ps.map((p, i) => `<button class="cell" data-go="${p.id}" data-flash aria-label="${pad(i + 1)} ${esc(loc(p.name))}"><span class="no">${pad(i + 1)}</span>${thSpan(p)}</button>`).join('')}</div>`;
}
function vFree(ps, editing){
  return `<div class="free ${editing ? 'edit' : ''}">${ps.map((p, i) => {
    const f = fpos(p), st = `left:${f.x}%;top:${f.y}%;width:${f.w}%`;
    const inner = `${thSpan(p)}<span class="no">${pad(i + 1)}</span>`;
    return editing
      ? `<div class="fi ${S.freeSel === p.id ? 'sel' : ''}" data-fid="${p.id}" style="${st}">${inner}</div>`
      : `<button class="fi" data-go="${p.id}" data-flash style="${st}" aria-label="${pad(i + 1)} ${esc(loc(p.name))}">${inner}</button>`;
  }).join('')}</div>`;
}
function vSeoul(){
  const ps = plist();
  return `<div class="page">${head('Collective Seoul', 'menu')}
  <div class="views"><div class="langs row"><button data-view="free" class="${S.view === 'free' ? 'on' : ''}">Free</button><button data-view="grid" class="${S.view === 'grid' ? 'on' : ''}">Grid</button></div></div>
  <main class="gal">${S.view === 'grid' ? vGrid(ps) : vFree(ps, false)}</main></div>`;
}
function vDetail(id, full){
  const ps = plist(), i = ps.findIndex(p => p.id === id), p = ps[i];
  const prev = ps[(i - 1 + N) % N], next = ps[(i + 1) % N];
  const photos = p.photos.length
    ? p.photos.map(a => `<img src="${src(a)}" alt="" loading="lazy">`).join('')
    : (full ? '' : [1, 2].map(n => `<div class="ph">${tx('photo')} ${pad(n)} · ${tx('photoTodo')}</div>`).join(''));
  return `<article class="det"><div class="dtop"><div class="num">${pad(i + 1)}</div><div class="dname">${esc(loc(p.name) || '—')}</div></div><div class="big th">${thumb(p)}</div>
  <div class="inset"><div class="info">
    <div><div class="lbl">Typology</div><div class="val">${esc(loc(p.typology) || '—')}</div></div>
    <div><div class="lbl">Exhibition</div><div class="val">${esc(loc(p.exhibition) || '—')}</div></div>
    <div><div class="lbl">Year</div><div class="val">${esc(p.year || '—')}</div></div>
  </div>
  ${paras(p.caption).map(t => `<p class="capt">${esc(t)}</p>`).join('')}
  ${photos ? `<div class="photos">${photos}</div>` : ''}
  ${full ? `<nav class="pager"><button data-go="${prev.id}">← ${pad(i === 0 ? N : i)}</button><button data-go="${next.id}">${pad(i === N - 1 ? 1 : i + 2)} →</button></nav>` : ''}</div>
  ${foot(p.designers.map(x => ({label: x.label, name: loc(x.name), ig: x.ig, email: x.email})))}</article>`;
}
// stacked photos, macOS-stack style: the current photo on top, the rest fanned underneath at fixed tilts
const TILT = [-2, 4, -5, 7, -8];
function stackHtml(e){
  const ph = e ? e.photos : [];
  if (!ph.length) return `<div class="stack" aria-hidden="true">${[1, 0].map(k => `<span class="card blank" style="transform:translate(-50%,-50%) rotate(${TILT[k]}deg)"></span>`).join('')}</div>`;

    if (d.aprm !== undefined) {
      const key = 'ap' + aid + d.aprm;
      if (S.confirm !== key) { S.confirm = key; rbody(); return; }
      const en = aEntry(aid), [old] = en.photos.splice(+d.aprm, 1); edit('archive/' + aid, en, 0); S.confirm = null; if (old && S.assets) S.assets.delete(old).catch(() => {}); rbody(); return;
    }
  }
  if ('rmbrief' in d) {
    if (S.confirm !== 'brief') { S.confirm = 'brief'; rbody(); return; }
    const c = conf(), old = c.brief.id; c.brief.id = null; c.brief.name = ''; saveC(c, 0); S.confirm = null; if (old && S.assets) S.assets.delete(old).catch(() => {}); rbody(); return;
  }
  if ('brief' in d) { downloadBrief(t); return; }
  if ('rmlogo' in d) { const c = conf(), old = c.logo; c.logo = null; saveC(c, 0); if (old && S.assets) S.assets.delete(old).catch(() => {}); rbody(); return; }
});

document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.f) { const p = product(S.sel); setPath(p, d.f, t.value); saveP(p, 600); return; }
  if (d.cf) { const c = conf(); setPath(c, d.cf, t.value); saveC(c, 600); return; }
  if (d.af) { const aid = t.closest('[data-aid]').dataset.aid, en = aEntry(aid); setPath(en, d.af, t.value); edit('archive/' + aid, en, 600); return; }
  if (t.id === 'fsize' && S.freeSel) {
    const p = product(S.freeSel); p.freePos = {...fpos(p), w: +t.value}; saveP(p, 500);
    const el = document.querySelector(`.free.edit [data-fid="${S.freeSel}"]`); if (el) el.style.width = t.value + '%';
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.up || !t.files || !t.files.length) return;
  const card = t.closest('[data-aid]');
  upload([...t.files], t.dataset.up, card && card.dataset.aid); t.value = '';
});

/* free layout dragging (builder only) */
document.addEventListener('pointerdown', e => {
  const it = e.target.closest('.free.edit .fi'); if (!it) return;
  e.preventDefault();
  const box = it.parentElement.getBoundingClientRect(), r0 = it.getBoundingClientRect();
  S.freeSel = it.dataset.fid;
  document.querySelectorAll('.free.edit .fi.sel').forEach(x => x.classList.remove('sel')); it.classList.add('sel');
  drag = {id: it.dataset.fid, it, box, ox: e.clientX - (r0.left + r0.width / 2), oy: e.clientY - (r0.top + r0.height / 2), moved: false};
  try { it.setPointerCapture(e.pointerId); } catch(er){}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const clamp = v => Math.max(0, Math.min(100, v));
  drag.x = clamp((e.clientX - drag.ox - drag.box.left) / drag.box.width * 100);
  drag.y = clamp((e.clientY - drag.oy - drag.box.top) / drag.box.height * 100);
  drag.it.style.left = drag.x + '%'; drag.it.style.top = drag.y + '%'; drag.moved = true;
});
function endDrag(){
  if (!drag) return;
  const dd = drag; drag = null;
  if (dd.moved) { const p = product(dd.id); p.freePos = {x: +dd.x.toFixed(2), y: +dd.y.toFixed(2), w: fpos(p).w}; saveP(p, 0); }
  rbody();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* product list drag-to-reorder (desktop) */
document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('.pli'); if (!li) return; S.dragPid = li.dataset.pid; try { e.dataTransfer.setData('text/plain', li.dataset.pid); e.dataTransfer.effectAllowed = 'move'; } catch(er){} });
document.addEventListener('dragover', e => { const li = e.target.closest && e.target.closest('.pli'); if (!li || !S.dragPid) return; e.preventDefault(); document.querySelectorAll('.pli.over').forEach(x => x !== li && x.classList.remove('over')); li.classList.add('over'); });
document.addEventListener('drop', e => {
  const li = e.target.closest && e.target.closest('.pli'); if (!li || !S.dragPid) return; e.preventDefault();
  const from = S.dragPid; S.dragPid = null;
  const a = plist().map(p => p.id), fi = a.indexOf(from), ti = a.indexOf(li.dataset.pid);
  if (fi === ti) { render(); return; }
  a.splice(fi, 1); a.splice(ti, 0, from);
  reorder(a); render();
});
document.addEventListener('dragend', () => { S.dragPid = null; document.querySelectorAll('.pli.over').forEach(x => x.classList.remove('over')); });

/* ---------- boot ---------- */
const use = n => { try { return window.claude && window.claude.use ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null); } catch(e){ return Promise.resolve(null); } };
if (STATIC) { S.products = STATIC.products || {}; S.archive = STATIC.archive || {}; S.config = STATIC.config || {}; S.ready = S.loaded = true; }
render();
(async () => {
  if (STATIC) return;
  const [db, user, assets] = await Promise.all([use('db'), use('user'), use('assets')]);
  S.db = db; S.assets = assets;
  S.canEdit = user ? await user.canEdit() : false;
  S.ready = true;
  if (!db) { S.loaded = true; render(); return; }
  const fail = er => { if (er && er.code !== 'revoked') setStatus('데이터 연결 오류 (' + er.code + ')'); };
  db.collection('products').onSnapshot(s => { const m = {}; s.docs.forEach(x => { m[x.id] = x.data(); }); S.products = m; onData(); }, fail);
  db.collection('archive').onSnapshot(s => { const m = {}; s.docs.forEach(x => { if (!S.gone.has(x.id)) m[x.id] = x.data(); }); S.archive = m; onData(); }, fail);
  db.doc('site/config').onSnapshot(x => { S.config = x.exists ? x.data() : {}; onData(); }, fail);
  render();
})();
})();
</script>

</body></html>
